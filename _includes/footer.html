<footer class="site-footer">
  <div class="shell footer-inner">
    <div class="footer-left">
      <div class="footer-brand">{{ site.author }} · {{ site.title }}</div>
      <p class="footer-quote">{{ site.tagline }}</p>
    </div>
    <div class="footer-right">
      <div>EST. 2026 · {{ site.time | date: "%Y" }}</div>
      <div><a href="{{ '/' | relative_url }}">回到目录</a></div>
    </div>
  </div>
  <div class="footer-end">
    <a class="end-stamp" href="#top" aria-label="回到顶部">翻<br>完</a>
  </div>
</footer>
