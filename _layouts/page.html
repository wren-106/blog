---
layout: default
---

<div class="shell page-grid">
  <aside class="post-aside">
    <a class="post-cat" href="{{ '/' | relative_url }}">目录</a>
    <span class="post-rule" aria-hidden="true"></span>
    <span class="post-len">{{ page.title }}</span>
  </aside>
  <div class="page-main">
    <h1 class="page-title">{{ page.title }}</h1>
    <div class="page-body">
      {{ content }}
    </div>
  </div>
</div>
