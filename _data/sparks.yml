- kind: spark
  tag: 案例
  kicker: AI 走进工作流
  title: 四个智能体，替掉一条接力链
  source: 钛动科技 Navos 2.0 × 广州化妆品代工厂出海
  date: 2026-07
  quote: 它省掉的不是人力，是转述。
  body: |
    钛动科技在 WAIC 2026 发布 Navos 2.0，把出海营销拆成咨询、创意、营销、资产四个智能体，组成一个虚拟团队。案例企业原本给国际大牌做代工，转做自有品牌后，在 TikTok Shop 东南亚冲到美妆类目 TOP3，年销售额从千万级跨到近十亿——数字是服务商口径，要打折看，但方向清楚。

    最容易说成「AI 提效」，真正的变化在链条上：洞察产出直接启动创意，中间那层「人转述给人」的环节没有了，信息损耗也跟着没了。经验还能沉淀成组织资产——智能体记得什么素材在什么市场跑得好，换个人接手也不用从头讲一遍。
  take: 判断一条 AI 案例值不值得记：看它改的是某个环节的速度，还是团队分工的形状。前者是工具，后者是组织。

- kind: spark
  tag: 金句
  kicker: 南风窗 · 关于作者性
  title: 不可替代的理由，是想被理解
  source: 南风窗「作者性」论述
  date: 2026-11
  quote: 我们始终想要生活在一个可以相互理解的世界里。
  body: |
    南风窗那段话把「作者性」从版权问题挪到了理解问题上：AI 可以生成内容，但生成不了「我想让你懂我」这件事。所以创作者不可替代，不是因为手艺更好，而是因为人需要一个能被理解的对面。

    后面接的「热爱所向，万千回响」是平台的广告语，也是这段论述的软肋——把创作者的权利交给平台托举，逻辑上等于把裁判权让渡出去。
  take: 引用时值得注意：这段的主语是「我们」，不是「作者」。它替读者说话，也就顺手替平台说了话。

- kind: spark
  tag: 观察
  kicker: 官媒的动画试验
  title: 把新闻画成动画，换的不是画笔
  source: 央视网《流金谷恩仇录》（AI 奇谈）· 中国日报《南海仲裁案裁决》·《千里江山图》动画化
  date: 2026-11
  quote: 从「通报事实」到「给事实一个形状」。
  body: |
    三个样本放在一起看：央视网用武侠框架讲国际争端，中国日报把南海仲裁案的裁决做成动画，还有《千里江山图》的动画化。共同点不是「AI 会做动画」，而是官媒在换表达方式——把不容易讲清的国际议题，改成有角色、有恩怨的短剧。

    这类内容真正的门槛不在画面，在剧本：要让一个不懂前因后果的人，在几分钟里站到某一方。所以它天生带立场，也天生比通报更容易被记住。
  take: 收这类样本时记一句：它换的是生产工具，还是叙事语法。前者可以外包，后者不能。

- kind: book
  tag: 书摘
  kicker: 塔拉·韦斯特弗 · 2018
  title: 你当像鸟飞往你的山
  author: 塔拉·韦斯特弗
  source: 回忆录
  quote: 过去是一个幽灵，虚无缥缈，没什么影响力。只有未来才有分量。
  quips:
    - 你可以爱一个人，但仍然选择离开他。
    - 只有依靠自己，胜算才更大。
  body: |
    十七岁前没上过学的女孩，从废铜烂铁的垃圾场一路走到剑桥。容易读成逆袭故事，其实她写的是「醒过来」：不是把山甩在身后，而是承认那座山一直在心里，然后仍然选择另一座。

    最有用的一句不是励志，是那个自问：这是我的选择，还是他们的声音。
  take: 适合在「要不要离开某个环境」的时候重读，不适合当鸡汤。

- kind: book
  tag: 书摘
  kicker: 简·奥斯汀 · 1813
  title: 傲慢与偏见
  author: 简·奥斯汀
  source: 小说
  quote: 傲慢让别人无法来爱我，偏见让我无法去爱别人。
  quips:
    - 一个人可以傲慢而不虚荣。傲慢多指我们对自己的看法，而虚荣则指我们希望别人如何评价我们。
  body: |
    书里摆了四种婚事：夏洛特为现实委身，莉迪亚为激情盲目，简与宾利是温柔相配，达西与伊丽莎白是精神平等。两百年前就把「婚姻不该是交易，也不该是冲动」写得比今天的婚恋讨论清楚。

    重读才发现「霸总鼻祖」是浅层标签。真正的情节是两个人各自修正自己：一个放下身段，一个放下成见。
  take: 判断一段关系稳不稳，看它落在哪一种模板上：将就、互补，还是彼此校准。
