# ===== 站点基本信息 =====
title: 观察笔记
description: 一份关于信息、机制与钱的观察笔记
author: 润一

# ===== 关键：子仓库必须配 baseurl =====
# 仓库名是 blog，所以 baseurl 设为 /blog
# 站点最终地址：https://wren-106.github.io/blog/
url: "https://wren-106.github.io"
baseurl: "/blog"

# ===== 主题 =====
theme: minima

# ===== 插件（都在 GitHub Pages 白名单内）=====
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# ===== 构建 =====
markdown: kramdown
permalink: /:year/:month/:day/:title/

# 文章首页显示摘要
show_excerpts: true

# 时区
timezone: Asia/Shanghai

# ===== 排除不参与构建的文件 =====
# 注意：assets/ 下的 .md 会被 GitHub Pages 当成页面渲染，
# 还会出现在顶部导航里（minima 会列出所有 page），所以一并排除
exclude:
  - README.md
  - .gitignore
  - "assets/images/posts/info-gap/README.md"
